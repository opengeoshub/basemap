<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vietnam Basemaps</title>
  
  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- Map Style Switcher CSS -->
  <link rel="stylesheet" href="https://unpkg.com/map-gl-style-switcher@latest/dist/map-gl-style-switcher.css" />
  
  <!-- MapLibre GL Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;   
    }
    
    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    #map {
      width: 100%;
      height: 100vh;
    }    
 
  </style>
</head>
<body>
  <div id="map"></div> 

  <!-- Map Style Switcher JS -->
  <script src="https://unpkg.com/map-gl-style-switcher@latest/dist/index.umd.js"></script>
  
  <!-- MapLibre GL Geocoder JS -->
  <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>

  <!-- PMTiles (UMD global: pmtiles) — do not ES-import dist/pmtiles.js -->
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>

  <!-- maplibre-contour (UMD global: mlcontour) for DEM-derived contour lines -->
  <script src="https://unpkg.com/maplibre-contour@0.0.5/dist/index.min.js"></script>
  
  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs';
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    // Client-side contours from Mapterhorn DEM (https://mapterhorn.com/examples/contour/)
    const demSource = new mlcontour.DemSource({
      url: 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp',
      encoding: 'terrarium',
      maxzoom: 12,
      worker: true
    });
    demSource.setupMaplibre(maplibregl);

    // Define available map styles (from opengeoshub/vstyles)
    const VSTYLES_BASE = 'https://raw.githubusercontent.com/opengeoshub/vstyles/refs/heads/main/vstyles/vn';
    const styles = [
      {
        id: 'admin',
        name: 'Admin',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/voyager.png',
        styleUrl: `${VSTYLES_BASE}/admin.json`,
        description: 'Administrative boundaries with provinces and wards'
      },
      {
        id: 'dark',
        name: 'Dark',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/dark.png',
        styleUrl: `${VSTYLES_BASE}/dark.json`,
        description: 'Dark theme for low-light viewing'
      },
      {
        id: 'night',
        name: 'Night',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/dark.png',
        styleUrl: `${VSTYLES_BASE}/night.json`,
        description: 'Night Earth style with satellite night lights'
      },
      {
        id: 'positron',
        name: 'Positron',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/positron.png',
        styleUrl: `${VSTYLES_BASE}/positron.json`,
        description: 'Light, minimal style'
      },
      {
        id: 'toner',
        name: 'Toner',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/dark.png',
        styleUrl: `${VSTYLES_BASE}/toner.json`,
        description: 'High contrast black and white style'
      },
      {
        id: 'fiord',
        name: 'Fiord',
        image: 'https://raw.githubusercontent.com/opengeoshub/vstyles/refs/heads/main/vstyles/omt/fiord/fiord.png',
        styleUrl: `${VSTYLES_BASE}/fiord.json`,
        description: 'Cool blue-toned style'
      },
      {
        id: 'liberty',
        name: 'Liberty',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/osm.png',
        styleUrl: `${VSTYLES_BASE}/liberty.json`,
        description: 'Liberty style'
      },
      {
        id: 'topography',
        name: 'Topography',
        image: 'https://raw.githubusercontent.com/opengeoshub/vstyles/refs/heads/main/vstyles/omt/topography/topography.png',
        styleUrl: `${VSTYLES_BASE}/topography.json`,
        description: 'Topographic style with contours and hillshade'
      },
      {
        id: 'terrain',
        name: 'Terrain',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/arcgis-hybrid.png',
        styleUrl: `${VSTYLES_BASE}/terrain.json`,
        description: 'Terrain style with elevation'
      },     
      {
        id: '3d',
        name: '3D',
        image: 'https://raw.githubusercontent.com/muimsd/map-gl-style-switcher/refs/heads/main/public/osm.png',
        styleUrl: `${VSTYLES_BASE}/3d.json`,
        description: '3D map style with terrain and buildings'
      }
    ];

    // Initialize the map with the first style
    const map = new maplibregl.Map({
      container: 'map',
      style: styles[0].styleUrl,
      center: [108.2772, 14.0583],
      zoom: 3.5,
    });

    // map.addControl(new maplibregl.GlobeControl());

    // Wait for the map to load
    map.on('load', () => {
      console.log('Map loaded successfully');
    });

    // Handle map errors
    map.on('error', (e) => {
      console.error('Map error:', e);
    });

    // Initialize the style switcher control
    const styleSwitcher = new mapglstyleswitcher.StyleSwitcherControl({
      styles: styles,
      theme: 'auto', // 'light', 'dark', or 'auto'
      activeStyleId: styles[0].id,
      onAfterStyleChange: (from, to) => {
        console.log(`Switching from ${from.name} to ${to.name}`);
        map.setStyle(to.styleUrl);
      },
      onBeforeStyleChange: (from, to) => {
        console.log(`About to switch from ${from.name} to ${to.name}`);
      }
    });

    // Geocoder API using Nominatim
    const geocoderApi = {
      forwardGeocode: async (config) => {
        const features = [];
        try {
          const query = encodeURIComponent(config.query);
          const request =
            `https://nominatim.openstreetmap.org/search?q=${query}&format=geojson&polygon_geojson=1&addressdetails=1`;
          const response = await fetch(request);
          const geojson = await response.json();
          for (const feature of geojson.features) {
            const center = [
              feature.bbox[0] +
                (feature.bbox[2] - feature.bbox[0]) / 2,
              feature.bbox[1] +
                (feature.bbox[3] - feature.bbox[1]) / 2
            ];
            const point = {
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: center
              },
              place_name: feature.properties.display_name,
              properties: feature.properties,
              text: feature.properties.display_name,
              place_type: ['place'],
              center
            };
            features.push(point);
          }
        } catch (e) {
          console.error(`Failed to forwardGeocode with error: ${e}`);
        }

        return {
          features
        };
      }
    };

    // Add the geocoder control to the top-left
    map.addControl(
      new MaplibreGeocoder(geocoderApi, {
        maplibregl,
        zoom: 12,
        flyTo: {
          maxZoom: 12
        }
      }),
      'top-left'
    );

    // Add the style switcher control to the map
    map.addControl(styleSwitcher, 'bottom-right');
    map.addControl(new maplibregl.GlobeControl(), 'top-right');
    // Add navigation controls (visualizePitch helps with 3D terrain)
    map.addControl(
      new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
      }),
      'top-right'
    );
    // Toggle 3D terrain (requires terrainSource in the active style, e.g. terrain.json)
    map.addControl(
      new maplibregl.TerrainControl({
        source: 'terrainSource',
        exaggeration: 1
      }),
      'top-right'
    );
  </script>
</body>
</html>
